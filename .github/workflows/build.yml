name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/PitGlow.Tests/PitGlow.Tests.csproj -c Release --logger GitHubActions --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/PitGlow.Tests/TestResults/*.trx

      - name: Publish PitGlow.exe
        run: dotnet publish src/PitGlow.Cli/PitGlow.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish

      - name: Bundle Corsair iCUE SDK
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri https://api.github.com/repos/CorsairOfficial/cue-sdk/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $asset = $rel.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          Write-Host "iCUE SDK $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile cuesdk.zip
          Expand-Archive cuesdk.zip -DestinationPath cuesdk
          $dll = Get-ChildItem cuesdk -Recurse -Filter 'iCUESDK.x64_2019.dll' | Select-Object -First 1
          if (-not $dll) { throw "iCUESDK.x64_2019.dll not found in $($asset.name)" }
          New-Item -ItemType Directory -Force publish/x64 | Out-Null
          Copy-Item $dll.FullName publish/x64/
          $lic = Get-ChildItem cuesdk -Recurse -Include 'LICENSE*','*license*' | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName publish/x64/iCUESDK-LICENSE.txt }

      - name: Add launchers and docs
        shell: pwsh
        run: |
          Copy-Item packaging/*.bat publish/
          Copy-Item README.md publish/
          Copy-Item LICENSE publish/LICENSE.txt
          Get-ChildItem publish

      - name: Upload PitGlow
        uses: actions/upload-artifact@v4
        with:
          name: PitGlow-win-x64
          path: publish/

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          "version=$($props.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT

      - name: Zip
        if: github.event_name == 'push'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "PitGlow-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PitGlow ${{ steps.version.outputs.version }} (beta)
          target_commitish: ${{ github.sha }}
          files: PitGlow-${{ steps.version.outputs.version }}-win-x64.zip
          prerelease: true
          body: |
            Download **PitGlow-${{ steps.version.outputs.version }}-win-x64.zip**, unzip it anywhere, and see README.md inside.
            Built and tested automatically from commit ${{ github.sha }}.
